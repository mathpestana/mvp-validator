services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: validador
      POSTGRES_PASSWORD: validador
      POSTGRES_DB: validador
    ports:
      - "5432:5432"
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validador -d validador"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados_pg:
